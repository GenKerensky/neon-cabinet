<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vector Studio Preview</title>
    <style>
      :root {
        --panel: rgba(7, 13, 24, 0.86);
        --panel-strong: rgba(10, 18, 34, 0.96);
        --line: rgba(0, 255, 204, 0.24);
        --line-hot: rgba(255, 0, 221, 0.45);
        --text: #e8fff9;
        --muted: #78988f;
        --accent: #00ffd5;
        --accent-2: #ff27d8;
        --danger: #ff5470;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow: hidden;
        color: var(--text);
        font-family: "IBM Plex Mono", "Fira Code", monospace;
        background:
          radial-gradient(circle at 44% 45%, rgba(255, 0, 213, 0.1), transparent 18rem),
          radial-gradient(circle at 62% 36%, rgba(0, 255, 213, 0.08), transparent 22rem),
          linear-gradient(135deg, #020305 0%, #050810 48%, #010104 100%);
      }

      #game-container {
        width: 100vw;
        height: 100vh;
      }

      #ui {
        position: absolute;
        top: 18px;
        right: 18px;
        z-index: 10;
        width: 340px;
        max-height: calc(100vh - 36px);
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 18px;
        overflow: hidden;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 22px;
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.55), 0 0 38px rgba(0, 255, 213, 0.09), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(18px);
      }

      #ui::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        border-radius: inherit;
        background: linear-gradient(135deg, rgba(0, 255, 213, 0.16), transparent 34%, rgba(255, 39, 216, 0.14));
        mask: linear-gradient(#000, transparent 58%);
      }

      .studio-header,
      .panel-section {
        position: relative;
      }

      .eyebrow {
        margin-bottom: 6px;
        color: var(--accent);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1;
        letter-spacing: -0.04em;
      }

      .asset-chip {
        margin-top: 12px;
        padding: 10px 12px;
        overflow: hidden;
        color: #bfffee;
        font-size: 11px;
        line-height: 1.45;
        text-overflow: ellipsis;
        background: rgba(0, 0, 0, 0.28);
        border: 1px solid rgba(0, 255, 213, 0.16);
        border-radius: 14px;
        white-space: nowrap;
      }

      .asset-chip span:first-child {
        color: var(--muted);
      }

      .panel-section {
        padding: 14px;
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
      }

      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        color: #f2fffb;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .section-title::after {
        content: "";
        width: 46px;
        height: 1px;
        background: linear-gradient(90deg, var(--accent), transparent);
      }

      .button-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      button {
        min-height: 38px;
        color: var(--text);
        font: inherit;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        background: linear-gradient(180deg, rgba(0, 255, 213, 0.18), rgba(0, 255, 213, 0.07));
        border: 1px solid rgba(0, 255, 213, 0.4);
        border-radius: 12px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 12px 24px rgba(0, 0, 0, 0.22);
        transition: transform 140ms ease, border-color 140ms ease, background 140ms ease, box-shadow 140ms ease;
      }

      button:hover {
        transform: translateY(-1px);
        border-color: rgba(255, 39, 216, 0.85);
        background: linear-gradient(180deg, rgba(255, 39, 216, 0.22), rgba(0, 255, 213, 0.1));
        box-shadow: 0 0 26px rgba(255, 39, 216, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.18);
      }

      button.is-active {
        color: #06100e;
        border-color: rgba(255, 255, 255, 0.55);
        background: linear-gradient(180deg, #fff7a8, var(--accent));
        box-shadow: 0 0 30px rgba(0, 255, 213, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.48);
      }

      .direction-pad {
        width: 162px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(3, 46px);
        grid-template-rows: repeat(3, 42px);
        gap: 8px;
        justify-content: center;
      }

      .dir-btn {
        min-height: 42px;
        padding: 0;
        font-size: 16px;
      }

      .dir-center {
        color: #03110e;
        background: linear-gradient(180deg, var(--accent), #39ff88);
        border-color: rgba(255, 255, 255, 0.42);
      }

      .dir-up { grid-column: 2; grid-row: 1; }
      .dir-left { grid-column: 1; grid-row: 2; }
      .dir-center { grid-column: 2; grid-row: 2; }
      .dir-right { grid-column: 3; grid-row: 2; }
      .dir-down { grid-column: 2; grid-row: 3; }

      .scale-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      .scale-value {
        color: var(--accent);
        font-size: 18px;
        font-weight: 900;
        letter-spacing: -0.04em;
      }

      .scale-control {
        width: 100%;
        height: 6px;
        margin: 6px 0 14px;
        appearance: none;
        cursor: pointer;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        border-radius: 999px;
        outline: none;
        box-shadow: 0 0 22px rgba(0, 255, 213, 0.18);
      }

      .scale-control::-webkit-slider-thumb {
        width: 18px;
        height: 18px;
        appearance: none;
        background: #f7fffb;
        border: 3px solid var(--accent);
        border-radius: 50%;
        box-shadow: 0 0 22px rgba(0, 255, 213, 0.5);
      }

      .scale-actions {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
      }

      .scale-actions button {
        min-height: 34px;
        padding: 0;
      }

      .transport-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .speed-value {
        color: var(--accent-2);
        font-size: 18px;
        font-weight: 900;
        letter-spacing: -0.04em;
      }

      .transport-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
      }

      .transport-grid button {
        min-height: 36px;
        padding: 0;
        font-size: 14px;
      }

      .transport-grid .play-toggle {
        color: #06100e;
        font-size: 18px;
        background: linear-gradient(180deg, #fff7a8, var(--accent));
        border-color: rgba(255, 255, 255, 0.55);
      }

      #layer-toggles {
        max-height: 310px;
        overflow-y: auto;
        padding-right: 6px;
      }

      #layer-toggles::-webkit-scrollbar {
        width: 8px;
      }

      #layer-toggles::-webkit-scrollbar-thumb {
        background: linear-gradient(var(--accent), var(--accent-2));
        border-radius: 999px;
      }

      #layer-toggles div {
        display: flex;
        align-items: center;
        min-height: 24px;
        color: #c9fff4;
      }

      input[type="checkbox"] {
        width: 14px;
        height: 14px;
        margin: 0 8px 0 0;
        accent-color: var(--accent);
      }

      label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #error-display {
        min-height: 0;
        color: var(--danger);
        font-size: 11px;
      }

      .hint {
        position: relative;
        color: var(--muted);
        font-size: 10px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="ui">
      <div class="studio-header">
        <div class="eyebrow">Neon Cabinet</div>
        <h1>Vector Studio</h1>
        <div id="error-display"></div>
        <div class="asset-chip"><span>Asset</span> <span id="asset-path">None</span></div>
      </div>

      <section class="panel-section">
        <div class="section-title">Preview</div>
        <div class="button-row">
          <button id="reload-btn">Reload</button>
          <button id="toggle-shader-btn">Shader</button>
        </div>
      </section>

      <section class="panel-section">
        <div class="section-title">Direction</div>
        <div class="direction-pad">
          <button class="dir-btn dir-up" data-dir="UP">↑</button>
          <button class="dir-btn dir-left" data-dir="LEFT">←</button>
          <button class="dir-btn dir-center" data-dir="CENTER">●</button>
          <button class="dir-btn dir-right" data-dir="RIGHT">→</button>
          <button class="dir-btn dir-down" data-dir="DOWN">↓</button>
        </div>
      </section>

      <section class="panel-section">
        <div class="scale-head">
          <div class="section-title">Scale</div>
          <div class="scale-value"><span id="scale-value">4.0</span>x</div>
        </div>
        <input id="scale-control" class="scale-control" type="range" min="1" max="8" step="0.25" value="4" />
        <div class="scale-actions">
          <button id="scale-down-btn">−</button>
          <button id="scale-reset-btn">Reset</button>
          <button id="scale-up-btn">+</button>
        </div>
      </section>

      <section class="panel-section">
        <div class="transport-head">
          <div class="section-title">Animation</div>
          <div class="speed-value"><span id="animation-speed-value">1.00</span>x</div>
        </div>
        <div class="transport-grid">
          <button id="prev-frame-btn">⟵</button>
          <button id="slow-down-btn">−</button>
          <button id="play-pause-btn" class="play-toggle is-active">⏸</button>
          <button id="speed-up-btn">+</button>
          <button id="next-frame-btn">⟶</button>
        </div>
      </section>

      <section class="panel-section">
        <div class="section-title">Layers</div>
        <div id="layer-toggles"></div>
      </section>

      <div class="hint">Use ?asset=apps/maze-runner/public/assets/vector/player.svg</div>
    </div>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
