<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Aura / Glow -->
  <g id="aura">
    <path d="M 4 30 L 4 14 A 12 12 0 0 1 28 14 L 28 28 L 23 32 L 18 26 L 13 31 L 8 27 Z"
      fill="none" stroke="#00ffff" stroke-width="5" opacity="0.3"
      data-slide-range="2.0"
      data-direction-bend='{"amount": 2.0, "pivotY": 30}'
      data-anim-wave='{"frequency": 8, "amplitude": 4.0, "points": 16, "yStart": 28, "yEnd": 16}' />
  </g>

  <!-- Ghost Body -->
  <path id="body" d="M 4 30 L 4 14 A 12 12 0 0 1 28 14 L 28 28 L 23 32 L 18 26 L 13 31 L 8 27 Z"
    fill="#0099ff" stroke="#ccffff" stroke-width="1.5" opacity="0.25"
    data-slide-range="2.0"
    data-direction-bend='{"amount": 2.0, "pivotY": 30}'
    data-anim-wave='{"frequency": 8, "amplitude": 4.0, "points": 16, "yStart": 28, "yEnd": 16}' />

  <!-- Frightened State Overlay -->
  <g id="frightened_overlay" display="none">
    <path d="M 4 30 L 4 14 A 12 12 0 0 1 28 14 L 28 28 L 23 32 L 18 26 L 13 31 L 8 27 Z"
      fill="#005599" stroke="#00ffff" stroke-width="1.5"
      data-slide-range="2.0"
      data-direction-bend='{"amount": 2.0, "pivotY": 30}'
      data-anim-wave='{"frequency": 8, "amplitude": 4.0, "points": 16, "yStart": 28, "yEnd": 16}' />
  </g>

  <!-- Eyes Container -->
  <g id="eyes" data-slide-range="6">
    <!-- Left Eye Shield (Smaller) -->
    <circle cx="10.5" cy="14" r="4.5" fill="#000000" opacity="0.7" />
    <!-- Right Eye Shield (Bigger) -->
    <circle cx="21.5" cy="13" r="6.0" fill="#000000" opacity="0.7" />

    <!-- Left Eye Sclera -->
    <circle cx="10.5" cy="14" r="3.5" fill="#e6ffff" opacity="0.9" />
    <!-- Left Eye Pupil (Looking down-left) -->
    <circle cx="9.5" cy="15" r="1.5" fill="#003366" />
    <circle cx="10.0" cy="14.5" r="0.8" fill="#ffffff" opacity="0.8" />

    <!-- Right Eye Sclera -->
    <circle cx="21.5" cy="13" r="5.0" fill="#e6ffff" opacity="0.9" />
    <!-- Right Eye Pupil (Looking up-right) -->
    <circle cx="23.0" cy="11.5" r="2.0" fill="#003366" />
    <circle cx="23.8" cy="10.8" r="1.0" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Dead State Eyes -->
  <g id="dead_eyes" display="none" data-slide-range="6">
    <path d="M 8.5 11 L 14.5 17 M 14.5 11 L 8.5 17" stroke="#ffffff" stroke-width="1.8" />
    <path d="M 17.5 11 L 23.5 17 M 23.5 11 L 17.5 17" stroke="#ffffff" stroke-width="1.8" />
  </g>
</svg>