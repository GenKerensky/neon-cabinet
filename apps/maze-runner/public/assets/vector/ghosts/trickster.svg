<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Aura / Glow -->
  <g id="aura">
    <path d="M 4 30 L 4 14 A 12 12 0 0 1 28 14 L 28 26 L 26 32 L 19 22 L 14 31 L 9 20 L 5 28 Z"
      fill="none" stroke="#cc66ff" stroke-width="4" opacity="0.4"
      data-slide-range="3.0"
      data-direction-bend='{"amount": 4.0, "pivotY": 20}'
      data-anim-wave='{"frequency": 40, "amplitude": 5.0, "points": 12, "yStart": 24, "yEnd": 10}' />
  </g>

  <!-- Ghost Body -->
  <path id="body" d="M 4 30 L 4 14 A 12 12 0 0 1 28 14 L 28 26 L 26 32 L 19 22 L 14 31 L 9 20 L 5 28 Z"
    fill="#9900ff" stroke="#e6ccff" stroke-width="1.5" opacity="0.25"
    data-slide-range="3.0"
    data-direction-bend='{"amount": 4.0, "pivotY": 20}'
    data-anim-wave='{"frequency": 40, "amplitude": 5.0, "points": 12, "yStart": 24, "yEnd": 10}' />

  <!-- Frightened State Overlay -->
  <g id="frightened_overlay" display="none">
    <path d="M 4 30 L 4 14 A 12 12 0 0 1 28 14 L 28 26 L 26 32 L 19 22 L 14 31 L 9 20 L 5 28 Z"
      fill="#005599" stroke="#00ffff" stroke-width="1.5"
      data-slide-range="3.0"
      data-direction-bend='{"amount": 4.0, "pivotY": 20}'
      data-anim-wave='{"frequency": 40, "amplitude": 5.0, "points": 12, "yStart": 24, "yEnd": 10}' />
  </g>

  <!-- Eyes Container -->
  <g id="eyes" data-slide-range="5">
    <!-- Left Eye Shield (Square-ish) -->
    <rect x="5" y="9" width="10" height="10" rx="2" fill="#000000" opacity="0.75" />
    <!-- Right Eye Shield (Circle) -->
    <circle cx="22.5" cy="16" r="4.0" fill="#000000" opacity="0.75" />

    <!-- Left Eye Sclera -->
    <rect x="6" y="10" width="8" height="8" rx="1" fill="#f2e6ff" opacity="0.9" />
    <!-- Left Eye Pupil -->
    <rect x="8" y="12" width="4" height="4" fill="#330066" />
    <rect x="9" y="13" width="1.5" height="1.5" fill="#cc99ff" opacity="0.8" />

    <!-- Right Eye Sclera -->
    <circle cx="22.5" cy="16" r="3.0" fill="#f2e6ff" opacity="0.9" />
    <!-- Right Eye Pupil -->
    <circle cx="22.5" cy="16" r="1.2" fill="#330066" />
    <circle cx="23.0" cy="15.5" r="0.5" fill="#cc99ff" opacity="0.8" />
  </g>

  <!-- Dead State Eyes -->
  <g id="dead_eyes" display="none" data-slide-range="5">
    <path d="M 8.5 11 L 14.5 17 M 14.5 11 L 8.5 17" stroke="#ffffff" stroke-width="1.8" />
    <path d="M 17.5 11 L 23.5 17 M 23.5 11 L 17.5 17" stroke="#ffffff" stroke-width="1.8" />
  </g>
</svg>