<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Aura / Glow -->
  <g id="aura">
    <path d="M 4 30 L 4 14 A 12 12 0 0 1 28 14 L 28 30 L 24 30 L 24 28 L 20 28 L 20 30 L 16 30 L 16 28 L 12 28 L 12 30 L 8 30 L 8 28 L 4 28 Z"
      fill="none" stroke="#33cc33" stroke-width="4" opacity="0.4"
      data-slide-range="0.2"
      data-direction-bend='{"amount": 0.0, "pivotY": 30}'
      data-anim-wave='{"frequency": 4, "amplitude": 0.5, "points": 8, "yStart": 28, "yEnd": 14}' />
  </g>

  <!-- Ghost Body -->
  <path id="body" d="M 4 30 L 4 14 A 12 12 0 0 1 28 14 L 28 30 L 24 30 L 24 28 L 20 28 L 20 30 L 16 30 L 16 28 L 12 28 L 12 30 L 8 30 L 8 28 L 4 28 Z"
    fill="#00ff00" stroke="#ccffcc" stroke-width="1.5" opacity="0.25"
    data-slide-range="0.2"
    data-direction-bend='{"amount": 0.0, "pivotY": 30}'
    data-anim-wave='{"frequency": 4, "amplitude": 0.5, "points": 8, "yStart": 28, "yEnd": 14}' />

  <!-- Frightened State Overlay -->
  <g id="frightened_overlay" display="none">
    <path d="M 4 30 L 4 14 A 12 12 0 0 1 28 14 L 28 30 L 24 30 L 24 28 L 20 28 L 20 30 L 16 30 L 16 28 L 12 28 L 12 30 L 8 30 L 8 28 L 4 28 Z"
      fill="#005599" stroke="#00ffff" stroke-width="1.5"
      data-slide-range="0.2"
      data-direction-bend='{"amount": 0.0, "pivotY": 30}'
      data-anim-wave='{"frequency": 4, "amplitude": 0.5, "points": 8, "yStart": 28, "yEnd": 14}' />
  </g>

  <!-- Eyes Container -->
  <g id="eyes" data-slide-range="1">
    <!-- Visor Shield -->
    <rect x="6" y="11" width="20" height="6" rx="1" fill="#000000" opacity="0.8" />

    <!-- Visor Sclera -->
    <rect x="7" y="12" width="18" height="4" rx="0.5" fill="#e6ffe6" opacity="0.9" />
    
    <!-- Scanning Pupil (Single wide pupil) -->
    <rect x="12" y="12.5" width="8" height="3" rx="0.5" fill="#003300" />
  </g>

  <!-- Dead State Eyes -->
  <g id="dead_eyes" display="none" data-slide-range="1">
    <path d="M 8.5 11 L 14.5 17 M 14.5 11 L 8.5 17" stroke="#ffffff" stroke-width="1.8" />
    <path d="M 17.5 11 L 23.5 17 M 23.5 11 L 17.5 17" stroke="#ffffff" stroke-width="1.8" />
  </g>
</svg>